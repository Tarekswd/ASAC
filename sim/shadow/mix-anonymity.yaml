# F5 network-level anonymity harness (see README.md). N client hosts emit the asac-client Poisson cover
# stream to an observer; exactly one (searcher) also mixes in a real query. The observer logs per-packet
# arrival time + source; analyze.py then checks whether the searcher can be found better than chance (1/N).
#
# Run from this directory with the built binaries beside it (see README "Run"):
#   cargo build -p asac-emit -p asac-observe
#   cp ../../target/debug/asac-emit ../../target/debug/asac-observe .
#   shadow mix-anonymity.yaml && python3 analyze.py shadow.data/hosts/observer/timings.csv --searcher-ip 11.0.0.7
#
# Each emitter gets a distinct --seed so the schedules are independent; the searcher differs ONLY by carrying
# a real --query (which, by design, does not change its send timing). All processes run until stop_time, so
# each declares expected_final_state: running (Shadow kills them at the end; that is not an error).
# IPs are auto-assigned alphabetically from 11.0.0.1: client1..5 = .1..5, observer = .6, searcher = .7.

general:
  stop_time: 2 min

network:
  graph:
    # Single switch; latency/bandwidth model the Tor+mix path.
    type: gml
    inline: |
      graph [
        node [
          id 0
          host_bandwidth_down "100 Mbit"
          host_bandwidth_up "100 Mbit"
        ]
        edge [
          source 0
          target 0
          latency "150 ms"
          packet_loss 0.0
        ]
      ]

hosts:
  observer:
    network_node_id: 0
    processes:
      - path: ./asac-observe
        args: --listen --out timings.csv
        start_time: 1s
        expected_final_state: running

  client1:
    network_node_id: 0
    processes:
      - path: ./asac-emit
        args: --observer observer --rate 2 --seed 11
        start_time: 5s
        expected_final_state: running
  client2:
    network_node_id: 0
    processes:
      - path: ./asac-emit
        args: --observer observer --rate 2 --seed 12
        start_time: 5s
        expected_final_state: running
  client3:
    network_node_id: 0
    processes:
      - path: ./asac-emit
        args: --observer observer --rate 2 --seed 13
        start_time: 5s
        expected_final_state: running
  client4:
    network_node_id: 0
    processes:
      - path: ./asac-emit
        args: --observer observer --rate 2 --seed 14
        start_time: 5s
        expected_final_state: running
  client5:
    network_node_id: 0
    processes:
      - path: ./asac-emit
        args: --observer observer --rate 2 --seed 15
        start_time: 5s
        expected_final_state: running

  # The one actually searching: same cover stream, plus a real query mixed in.
  searcher:
    network_node_id: 0
    processes:
      - path: ./asac-emit
        args: --observer observer --rate 2 --seed 20 --query "the real search"
        start_time: 5s
        expected_final_state: running
