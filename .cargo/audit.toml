# cargo-audit config. The advisories below are inherited from Arti's dependency tree (not ASAC's own crates)
# and currently have no available fix. They are tracked and disclosed in docs/EXTERNAL-PLAN.md, and must be
# re-reviewed on every Arti upgrade. CI (cargo audit) fails on any advisory NOT listed here, so new issues are
# still caught.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa 0.9.x Marvin timing sidechannel; arti-client -> tor-hscrypto -> ssh-key-fork-arti -> rsa; no fix
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 constant-time variability; same Arti tree; no fix
    "RUSTSEC-2025-0141", # bincode 2.0.1 unmaintained (warning only)
    "RUSTSEC-2024-0436", # paste 1.0.15 unmaintained (warning only)
]
