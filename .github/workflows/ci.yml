name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.92
        run: |
          rustup toolchain install 1.92 --profile minimal --component rustfmt clippy
          rustup default 1.92
          rustc --version

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  audit:
    name: cargo audit (dependency advisories)
    runs-on: ubuntu-latest
    # Don't force -D warnings when building the audit tool itself.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Audit dependencies
        # Reads .cargo/audit.toml (known, fix-less upstream advisories are ignored there); fails on anything new.
        run: cargo audit
      - name: Deny (licenses, bans, sources)
        # Supply-chain gate per deny.toml. Advisories are left to cargo audit above (single ignore list).
        run: cargo deny check licenses bans sources
