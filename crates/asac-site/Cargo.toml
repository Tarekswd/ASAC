[package]
name = "asac-site"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Search glue: turns a request (or raw query) into an HTML results page by querying asac-index and rendering with asac-frontend."

[dependencies]
tantivy = "=0.27.0"
asac-index = { path = "../asac-index" }
asac-frontend = { path = "../asac-frontend" }
asac-rank = { path = "../asac-rank" }
