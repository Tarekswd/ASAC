[package]
name = "potato"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Potato: a privacy-first Tor client layer built on Arti (Phase 0 skeleton)."

[dependencies]
# Pinned exactly in Phase 0 so builds are reproducible; bump deliberately. See PLAN.md 8 (upstream drift).
arti-client = "=0.47.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
futures = "0.3"
anyhow = "1"
tracing-subscriber = "0.3"
