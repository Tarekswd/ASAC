# cargo-fuzz harness for the untrusted HTTP response parser. Standalone (own [workspace]); requires a nightly
# toolchain + cargo-fuzz, and is run on demand, not in the stable CI. See README.md here.
[package]
name = "asac-fetch-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.7"
asac-fetch = { path = ".." }

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false

[workspace]
