[package]
name = "asac-fetch"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Live Fetcher backend for asac-crawler: HTTP over Tor via arti-client (onion and clear-web). Bridges the sync Fetcher trait to arti's async client."

[dependencies]
asac-crawler = { path = "../asac-crawler" }
# Potato's Arti feature set (rustls, no system OpenSSL/sqlite) PLUS onion-service-client: without it
# arti-client can't *connect to* .onion services, so crawling an onion URL fails (A1). See crates/potato/Cargo.toml.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "onion-service-client"] }
tor-rtcompat = { version = "=0.47.0", features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
# TLS over the Tor stream for https: ring provider (pure-Rust; avoids tokio-rustls' default aws-lc-rs C lib).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
# gzip/deflate body decompression, pure-Rust backend (miniz_oxide; no C zlib).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
url = "2.5.8"
anyhow = "1"

[lints]
workspace = true
