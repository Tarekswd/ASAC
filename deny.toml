# cargo-deny config: supply-chain checks for a security-sensitive project.
# Run with `cargo deny check` (install: `cargo install cargo-deny`).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Allow the permissive licenses common in the Arti dependency tree. Extend deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
