# Potato/ASAC Rust workspace (Phase 0). See PLAN.md section 5.
[workspace]
resolver = "2"
members = [
    "crates/potato",
    "crates/potato-policy",
    "crates/asac-decoy",
    "crates/potato-bench",
    "crates/asac-pir",
    "crates/asac-safety",
    "crates/asac-index",
    "crates/asac-search",
    "crates/asac-crawler",
    "crates/asac-frontend",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tarekswd/potarek"
rust-version = "1.92"
