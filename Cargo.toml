# Potato/ASAC Rust workspace (Phase 0). See PLAN.md section 5.
[workspace]
resolver = "2"
members = [
    "crates/potato",
    "crates/potato-policy",
    "crates/asac-decoy",
    "crates/potato-bench",
    "crates/asac-pir",
    "crates/asac-safety",
    "crates/asac-index",
    "crates/asac-search",
    "crates/asac-crawler",
    "crates/asac-frontend",
    "crates/asac-site",
    "crates/asac-fetch",
    "crates/asac-demo",
    "crates/asac-server",
    "crates/asac-rank",
    "crates/asac-mix",
    "crates/asac-client",
    "crates/asac-emit",
    "crates/asac-observe",
]
# asac-mix-nym (the live Nym mixnet backend) is kept OUT of the workspace on purpose: nym-sdk's tree requires
# blake3 >=1.7,<1.8.4, which conflicts with asac-pir's pinned `blake3 = "=1.8.7"`. A shared workspace lockfile
# can't satisfy both, so the Nym crate resolves its own lockfile. Build it with:
#   cargo build --manifest-path crates/asac-mix-nym/Cargo.toml
exclude = ["crates/asac-mix-nym"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tarekswd/asac"
rust-version = "1.92"

# No hand-rolled unsafe anywhere in ASAC's own crates (crypto/transport come from Arti + audited libs). Forbid
# it workspace-wide so that stays true; each member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
